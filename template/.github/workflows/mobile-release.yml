name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to qualify and build.
        required: true
        type: string
      submit_profile:
        description: EAS Submit profile used only when delivery is requested.
        required: true
        default: internal
        type: choice
        options:
          - internal
          - production
      deliver:
        description: Submit the promoted exact binaries after qualification.
        required: true
        default: false
        type: boolean

concurrency:
  group: mobile-release-${{ inputs.source_sha }}-${{ inputs.submit_profile }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify exact mobile binaries
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/release-qualification.yml@578cd414ab533f95eabf37ea8a71cef36eee6a83
    with:
      source_sha: ${{ inputs.source_sha }}
      setup_command: npm install --global bun@1.3.12 eas-cli@23.2.0 && bun install --frozen-lockfile
      qualification_command: bun run release:qualify
      build_command: bun run release:build
      artifact_paths: .artifacts/mobile-release
      timeout_minutes: 90
      artifact_retention_days: 30
    secrets:
      build_token: ${{ secrets.EXPO_TOKEN }}

  promote:
    name: Promote qualified mobile binaries
    needs: qualify
    permissions:
      actions: read
      attestations: read
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/artifact-promotion.yml@578cd414ab533f95eabf37ea8a71cef36eee6a83
    with:
      qualification_run_id: ${{ github.run_id }}
      qualification_receipt_artifact_name: ${{ needs.qualify.outputs.receipt_artifact_name }}
      artifact_retention_days: 30

  deliver:
    name: Deliver exact mobile binaries
    if: ${{ inputs.deliver }}
    needs:
      - qualify
      - promote
    permissions:
      actions: read
      attestations: read
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/deliver-qualified-expo-stores.yml@578cd414ab533f95eabf37ea8a71cef36eee6a83
    with:
      promotion_run_id: ${{ github.run_id }}
      promotion_receipt_artifact_name: ${{ needs.promote.outputs.receipt_artifact_name }}
      working_directory: .
      submit_profile: ${{ inputs.submit_profile }}
      eas_cli_version: 23.2.0
      timeout_minutes: 45
      artifact_retention_days: 30
    secrets:
      expo_token: ${{ secrets.EXPO_TOKEN }}
