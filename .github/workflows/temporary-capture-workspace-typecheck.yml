name: Temporary refresh storage workspace lock

on:
  push:
    branches:
      - codex/mobile-storage-workspace-foundation

permissions:
  contents: write

jobs:
  refresh:
    if: "${{ github.event.head_commit.message == 'chore: refresh storage workspace lock' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Refresh root workspace lock
        run: bun install
      - name: Verify clean-workspace contract
        run: |
          bun install --frozen-lockfile
          bun run lint
          bunx tsc --noEmit
          bun test
          bun run build
          bunx expo-doctor
          git diff --check
      - name: Preserve generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'fix: record storage package Bun types'
          git push origin HEAD:${{ github.ref_name }}
