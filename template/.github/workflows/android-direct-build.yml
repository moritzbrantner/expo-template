name: Android Direct Build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to qualify and build.
        required: true
        type: string

concurrency:
  group: android-direct-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify exact direct APK
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/release-qualification.yml@578cd414ab533f95eabf37ea8a71cef36eee6a83
    with:
      source_sha: ${{ inputs.source_sha }}
      setup_command: npm install --global bun@1.3.12 eas-cli@23.2.0 && bun install --frozen-lockfile
      qualification_command: bun run release:qualify:direct
      build_command: bun run release:build:direct
      artifact_paths: .artifacts/android-direct
      timeout_minutes: 90
      artifact_retention_days: 30
    secrets:
      build_token: ${{ secrets.EXPO_TOKEN }}

  promote:
    name: Promote qualified direct APK
    needs: qualify
    permissions:
      actions: read
      attestations: read
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/artifact-promotion.yml@578cd414ab533f95eabf37ea8a71cef36eee6a83
    with:
      qualification_run_id: ${{ github.run_id }}
      qualification_receipt_artifact_name: ${{ needs.qualify.outputs.receipt_artifact_name }}
      artifact_retention_days: 30
