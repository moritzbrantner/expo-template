services:
  dev-api:
    build:
      context: ./services/dev-api
    ports:
      - '4402:4002'

  auth-api:
    build:
      context: .
      dockerfile: services/auth-api/Dockerfile
    environment:
      PORT: 4001
      CORS_ORIGIN: '*'
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: noreply@example.test
      DATA_FILE: /data/users.json
      AUTH_API_ADMIN_EMAILS: admin@example.test
      AUTH_API_ENABLE_TEST_ENDPOINTS: 'true'
    ports:
      - '4401:4001'
    volumes:
      - auth-api-data:/data
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    ports:
      - '8825:8025'

volumes:
  auth-api-data:
