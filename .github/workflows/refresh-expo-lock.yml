name: Refresh Expo lock

on:
  push:
    branches:
      - feat/baby-clothes-tracker

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Refresh Expo package resolutions
        run: |
          bun update expo expo-router
          git restore package.json
          bun install --frozen-lockfile
          bunx expo-doctor
      - name: Commit lockfile only
        run: |
          git add bun.lock
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Expo lock"
          git push origin HEAD:${GITHUB_REF_NAME}
