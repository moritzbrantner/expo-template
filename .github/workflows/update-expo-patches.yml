name: Refresh Expo patch lock

on:
  push:
    branches:
      - baby-feeding-dedicated-log
    paths:
      - .github/workflows/update-expo-patches.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Refresh Expo SDK patch versions
        run: bun add 'expo@~57.0.21' 'expo-router@~57.0.20'
      - name: Verify Expo dependency alignment
        run: bunx expo-doctor
      - name: Commit refreshed lock
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore: align Expo SDK patch versions"
          git push origin HEAD:baby-feeding-dedicated-log
