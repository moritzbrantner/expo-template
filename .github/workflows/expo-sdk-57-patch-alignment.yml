name: Expo SDK 57 patch alignment

on:
  push:
    branches:
      - chore/expo-sdk-57-patch-alignment

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Align Expo SDK dependencies
        run: bunx expo install --fix

      - name: Verify package boundary
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:package.json'], { encoding: 'utf8' }));
          const after = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const allowed = new Set(['expo', 'expo-router', 'expo-image-manipulator', 'expo-image-picker']);
          const sections = ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies'];
          const unexpected = [];

          for (const section of sections) {
            const left = before[section] ?? {};
            const right = after[section] ?? {};
            for (const key of new Set([...Object.keys(left), ...Object.keys(right)])) {
              if (left[key] !== right[key] && !allowed.has(key)) {
                unexpected.push(`${section}.${key}: ${left[key] ?? '<missing>'} -> ${right[key] ?? '<missing>'}`);
              }
            }
          }

          const topLevelKeys = new Set([...Object.keys(before), ...Object.keys(after)]);
          for (const key of topLevelKeys) {
            if (sections.includes(key)) continue;
            if (JSON.stringify(before[key]) !== JSON.stringify(after[key])) {
              unexpected.push(`package.json.${key} changed`);
            }
          }

          if (unexpected.length) {
            console.error('Unexpected package.json changes:\n' + unexpected.join('\n'));
            process.exit(1);
          }
          NODE

          unexpected_files="$(git diff --name-only | grep -Ev '^(package.json|bun.lock)$' || true)"
          if [ -n "$unexpected_files" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected_files"
            exit 1
          fi

      - name: Reinstall from frozen lockfile
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile

      - name: Run Expo Doctor
        run: bunx expo-doctor

      - name: Commit aligned dependencies
        run: |
          rm .github/workflows/expo-sdk-57-patch-alignment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock .github/workflows/expo-sdk-57-patch-alignment.yml
          git commit -m "chore: align Expo SDK 57 patch versions"
          git push
