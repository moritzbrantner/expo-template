services:
  dev-api:
    build:
      context: ./services/dev-api
    ports:
      - '4402:4002'

  auth-api:
    build:
      context: .
      dockerfile: services/auth-api/Dockerfile
    environment:
      PORT: 4001
      CORS_ORIGIN: '*'
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: noreply@example.test
      DATA_FILE: /data/users.json
      AUTH_API_ADMIN_EMAILS: admin@example.test
      AUTH_API_ENABLE_TEST_ENDPOINTS: 'true'
    ports:
      - '4401:4001'
    volumes:
      - auth-api-data:/data
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - '8825:8025'

volumes:
  auth-api-data:
