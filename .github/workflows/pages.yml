name: GitHub Pages

on:
  pull_request:
    paths:
      - app/**
      - assets/**
      - components/**
      - constants/**
      - hooks/**
      - lib/**
      - packages/**
      - apps/**
      - portfolio/**
      - scripts/build-pages.mjs
      - mobile-analysis.config.json
      - app.config.ts
      - app.json
      - package.json
      - bun.lock
      - tsconfig.json
      - .github/workflows/pages.yml
      - .github/workflows/mobile-analysis.yml
  push:
    branches:
      - main
    paths:
      - app/**
      - assets/**
      - components/**
      - constants/**
      - hooks/**
      - lib/**
      - packages/**
      - apps/**
      - portfolio/**
      - scripts/build-pages.mjs
      - mobile-analysis.config.json
      - app.config.ts
      - app.json
      - package.json
      - bun.lock
      - tsconfig.json
      - .github/workflows/pages.yml
      - .github/workflows/mobile-analysis.yml
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build portfolio and Expo web apps
        run: node scripts/build-pages.mjs

      - name: Start Pages-compatible preview
        run: |
          mkdir -p .mobile-preview
          ln -s "$GITHUB_WORKSPACE/_site" .mobile-preview/expo-template
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .mobile-preview > /tmp/expo-template-preview.log 2>&1 &
          for _attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/expo-template/ > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/expo-template-preview.log
          exit 1

      - name: Analyze exact Pages artifact on mobile
        uses: moritzbrantner/mobile-analysis@9da915cde84922a5fcfd9d7ff15908be48ad1d62 # main
        with:
          target_url: http://127.0.0.1:4173/expo-template/
          config_path: mobile-analysis.config.json
          output_dir: mobile-analysis-output
          run_unlighthouse: 'true'

      - name: Upload mobile analysis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-analysis-pages
          path: mobile-analysis-output
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
