name: Mobile analysis

on:
  pull_request:
    paths:
      - app/**
      - apps/**
      - components/**
      - portfolio/**
      - scripts/build-pages.mjs
      - mobile-analysis.config.json
      - .github/workflows/mobile-analysis.yml
  workflow_dispatch:
  workflow_run:
    workflows:
      - GitHub Pages
    types:
      - completed
    branches:
      - main

jobs:
  analyze:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: moritzbrantner/mobile-analysis/.github/workflows/analyze.yml@main
    with:
      target_url: https://moritzbrantner.github.io/expo-template/
      config_path: mobile-analysis.config.json
      run_unlighthouse: true
