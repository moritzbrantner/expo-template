name: Bootstrap Expo 57 migration

on:
  push:
    branches:
      - chore/expo-57-baseline

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/expo-57-baseline
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Finish the Expo Router migration
        run: |
          bun remove @react-navigation/bottom-tabs @react-navigation/elements @react-navigation/native
          bunx expo-codemod sdk-56-expo-router-react-navigation-replace app components
          bunx expo install --fix
      - name: Commit generated migration state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock app components
          git diff --cached --quiet || git commit -m "refactor: use Expo Router navigation entry points"
          git push
