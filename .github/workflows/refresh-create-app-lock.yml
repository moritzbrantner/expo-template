name: Refresh create-app lock

on:
  push:
    branches:
      - feat/create-app-utility

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/create-app-utility
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Regenerate root lockfile
        run: bun install --lockfile-only
      - name: Commit regenerated lockfile when needed
        run: |
          if git diff --quiet -- bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Regenerate create-app lockfile"
          git push origin HEAD:feat/create-app-utility
