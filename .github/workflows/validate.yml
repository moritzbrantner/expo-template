name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@scaffold-v2-initial
    with:
      test_command: bun test
      lint_command: bun run lint
      typecheck_command: bunx tsc --noEmit
      build_command: bun run build
      post_validate_command: bunx expo-doctor
