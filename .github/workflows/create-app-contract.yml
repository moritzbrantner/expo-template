name: Create App Contract

on:
  pull_request:
    paths:
      - 'tooling/create-app/**'
      - 'tests/create-app.test.ts'
      - 'package.json'
      - '.github/workflows/create-app-contract.yml'
  push:
    branches:
      - feat/create-app-utility

permissions:
  contents: read

jobs:
  utility-preset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install repository graph
        run: bun install --frozen-lockfile
      - name: Verify generator unit contract
        run: bun test ./tests/create-app.test.ts
      - name: Generate disposable utility app
        run: |
          mkdir -p "$RUNNER_TEMP/create-app-contract"
          bun run create-app contract-fixture --preset=utility --output-root "$RUNNER_TEMP/create-app-contract"
      - name: Install generated app and prove frozen replay
        working-directory: ${{ runner.temp }}/create-app-contract/apps/contract-fixture
        run: |
          bun install
          bun install --frozen-lockfile
      - name: Typecheck generated app
        working-directory: ${{ runner.temp }}/create-app-contract/apps/contract-fixture
        run: bun run typecheck
      - name: Test generated app
        working-directory: ${{ runner.temp }}/create-app-contract/apps/contract-fixture
        run: bun test
      - name: Run Expo Doctor
        working-directory: ${{ runner.temp }}/create-app-contract/apps/contract-fixture
        run: bunx expo-doctor
      - name: Export generated app for web
        working-directory: ${{ runner.temp }}/create-app-contract/apps/contract-fixture
        run: bun run build
