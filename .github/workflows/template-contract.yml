name: Template Contract

on:
  pull_request:
    paths:
      - copier.yml
      - template/**
      - .github/workflows/template-contract.yml
  push:
    branches:
      - main
    paths:
      - copier.yml
      - template/**
      - .github/workflows/template-contract.yml

jobs:
  render:
    name: render / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - minimal
          - local-first
          - account-backed
          - scheduled

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install Copier
        run: python -m pip install 'copier>=9.10,<10'

      - name: Render profile
        run: |
          copier copy --trust --defaults \
            --data app_name="Fixture ${{ matrix.profile }}" \
            --data app_slug="fixture-${{ matrix.profile }}" \
            --data profile="${{ matrix.profile }}" \
            . generated

      - name: Verify generated contract
        env:
          EXPECTED_PROFILE: ${{ matrix.profile }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('generated/package.json', 'utf8'));
          const features = fs.readFileSync('generated/app.features.ts', 'utf8');
          const expected = process.env.EXPECTED_PROFILE;

          if (packageJson.name !== `fixture-${expected}`) throw new Error('wrong generated slug');
          if (!features.includes(`profile: '${expected}'`)) throw new Error('wrong feature profile');
          if (!fs.existsSync('generated/.copier-answers.yml')) throw new Error('missing Copier answers');
          NODE

      - name: Install generated dependencies
        working-directory: generated
        run: bun install

      - name: Typecheck generated app
        working-directory: generated
        run: bun run typecheck

      - name: Check Expo dependency health
        working-directory: generated
        run: bunx expo-doctor
