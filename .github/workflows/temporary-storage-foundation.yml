name: Temporary storage foundation migration

on:
  push:
    branches:
      - codex/mobile-storage-workspace-foundation

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message == 'chore: capture storage foundation typecheck' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Apply bounded workspace migration
        run: node scripts/temporary-apply-storage-foundation.mjs

      - name: Refresh dependency graph
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bunx tsc --noEmit 2>&1 | tee scripts/temporary-typecheck.log

      - name: Preserve typecheck diagnostic
        if: "${{ steps.typecheck.outcome == 'failure' }}"
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/temporary-typecheck.log
          git commit -m 'chore: preserve storage typecheck diagnostic'
          git push origin HEAD:${{ github.ref_name }}
          exit 1

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Expo Doctor
        run: bunx expo-doctor

      - name: Diff check
        run: git diff --check

      - name: Commit generated implementation and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock apps/tasks apps/habits packages/storage
          git commit -m 'feat: establish storage workspace foundation'
          git push origin HEAD:${{ github.ref_name }}
