name: Refresh Expo SDK lockfile

on:
  pull_request:
    paths:
      - .github/workflows/refresh-expo-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'foundation/generated-conformance'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - name: Verify existing lockfile
        run: bun install --frozen-lockfile
      - name: Align Expo SDK dependencies
        run: bunx expo install --fix
      - name: Verify Expo dependency health
        run: bunx expo-doctor
      - name: Verify refreshed lockfile
        run: bun install --frozen-lockfile
      - name: Commit deterministic dependency refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo 'Expo dependencies already aligned.'
            exit 0
          fi
          git commit -m 'fix: align Expo SDK patch dependencies'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
