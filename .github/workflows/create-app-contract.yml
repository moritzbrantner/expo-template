name: Create App Contract

on:
  pull_request:
    paths:
      - package.json
      - bun.lock
      - copier.yml
      - template/**
      - tooling/create-app/**
      - docs/generator.md
      - .github/workflows/create-app-contract.yml
  push:
    branches:
      - main
    paths:
      - package.json
      - bun.lock
      - copier.yml
      - template/**
      - tooling/create-app/**
      - docs/generator.md
      - .github/workflows/create-app-contract.yml

jobs:
  create:
    name: create / ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: utility
            profile: minimal
          - preset: standard
            profile: local-first

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install Copier
        run: python -m pip install 'copier==9.18.2'

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Test create-app tooling
        run: bun test ./tooling/create-app/create-app.test.ts

      - name: Create portfolio fixture
        run: |
          bun run create-app -- "fixture-${{ matrix.preset }}" \
            --name "Fixture's ${{ matrix.preset }}" \
            --preset "${{ matrix.preset }}"

      - name: Verify workspace and generated contract
        env:
          PRESET: ${{ matrix.preset }}
          EXPECTED_PROFILE: ${{ matrix.profile }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const preset = process.env.PRESET;
          const expectedProfile = process.env.EXPECTED_PROFILE;
          const slug = `fixture-${preset}`;
          const appRoot = `apps/${slug}`;
          const expectedPackageName = `@expo-template/${slug}`;
          const expectedAppName = `Fixture's ${preset}`;
          const rootPackage = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const appPackage = JSON.parse(fs.readFileSync(`${appRoot}/package.json`, 'utf8'));
          const appConfig = fs.readFileSync(`${appRoot}/app.config.ts`, 'utf8');
          const conventions = JSON.parse(fs.readFileSync(`${appRoot}/conventions.json`, 'utf8'));
          const tooling = JSON.parse(fs.readFileSync(`${appRoot}/.coding-tooling.json`, 'utf8'));
          const features = fs.readFileSync(`${appRoot}/app.features.ts`, 'utf8');
          const answers = fs.readFileSync(`${appRoot}/.copier-answers.yml`, 'utf8');
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const nameLiteral = appConfig.match(/^\s*name:\s*(.+),$/m)?.[1];

          if (!rootPackage.workspaces?.includes(appRoot)) throw new Error('generated app is not registered in the root workspace');
          if (rootPackage.workspaces.filter((candidate) => candidate === appRoot).length !== 1) throw new Error('generated workspace registration is duplicated');
          if (appPackage.name !== expectedPackageName) throw new Error('generated package identity is not workspace-scoped');
          if (appPackage.packageManager !== 'bun@1.3.12') throw new Error('generated Bun version is not exact');
          if (!nameLiteral || JSON.parse(nameLiteral) !== expectedAppName) throw new Error('human-readable app name was not rendered safely');
          if (conventions.registry !== 'coding-agent-conventions') throw new Error('generated convention registry is missing');
          if (tooling.profile !== 'repository-foundation-v1') throw new Error('generated tooling profile is missing');
          if (!tooling.tiers?.fast?.includes('typecheck')) throw new Error('generated fast tier must include typecheck');
          if (!features.includes(`profile: '${expectedProfile}'`)) throw new Error('public preset mapped to the wrong Copier profile');
          if (!/^package_name:/m.test(answers) || !answers.includes(expectedPackageName)) throw new Error('workspace package identity is not persisted in Copier answers');
          if (!answers.includes(head)) throw new Error('generated Copier provenance is not pinned to the exact template commit');
          if (/^_commit:\s*["']?None["']?$/m.test(answers)) throw new Error('generated Copier commit provenance is empty');
          if (/^_src_path:\s*["']?\/tmp\//m.test(answers)) throw new Error('generated Copier source points at an ephemeral temporary clone');
          NODE

      - name: Capture first generation fingerprint
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          app_root="apps/fixture-${PRESET}"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            --exclude='./node_modules' --exclude='./.expo' --exclude='./.conformance-web' \
            -C "$app_root" -cf - . | sha256sum | cut -d' ' -f1 > /tmp/generated-tree.sha256
          sha256sum package.json | cut -d' ' -f1 > /tmp/root-package.sha256
          sha256sum bun.lock | cut -d' ' -f1 > /tmp/root-lock.sha256

      - name: Verify generated app
        working-directory: apps/fixture-${{ matrix.preset }}
        run: |
          bun run lint
          bun run typecheck
          bun test
          bun run doctor
          bunx expo export --platform web --output-dir .conformance-web
          rm -rf .conformance-web .expo

      - name: Verify frozen cached install
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --offline

      - name: Verify Copier update provenance
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          app_root="apps/fixture-${PRESET}"
          update_root="apps/.copier-update-${PRESET}"
          rm -rf "$update_root"
          mkdir -p "$update_root"
          cp -a "$app_root/." "$update_root/"
          rm -rf "$update_root/node_modules" "$update_root/.expo" "$update_root/.conformance-web"
          git -C "$update_root" init -q
          git -C "$update_root" config user.name 'create-app-contract'
          git -C "$update_root" config user.email 'create-app-contract@example.invalid'
          git -C "$update_root" add -A
          git -C "$update_root" commit -qm 'Initial generated app'
          (
            cd "$update_root"
            copier update --trust --defaults --vcs-ref=HEAD
            git diff --check
            test -z "$(git status --porcelain)"
          )
          rm -rf "$update_root"

      - name: Verify repeatable generation
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          app_root="apps/fixture-${PRESET}"
          rm -rf "$app_root"
          git checkout -- package.json bun.lock
          bun run create-app -- "fixture-${PRESET}" \
            --name "Fixture's ${PRESET}" \
            --preset "${PRESET}"

          second_tree="$(tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            --exclude='./node_modules' --exclude='./.expo' --exclude='./.conformance-web' \
            -C "$app_root" -cf - . | sha256sum | cut -d' ' -f1)"
          test "$second_tree" = "$(cat /tmp/generated-tree.sha256)"
          test "$(sha256sum package.json | cut -d' ' -f1)" = "$(cat /tmp/root-package.sha256)"
          test "$(sha256sum bun.lock | cut -d' ' -f1)" = "$(cat /tmp/root-lock.sha256)"

      - name: Refuse destructive duplicate creation
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          before_package="$(sha256sum package.json)"
          before_lock="$(sha256sum bun.lock)"
          if bun run create-app -- "fixture-${PRESET}" --preset "${PRESET}"; then
            echo 'create-app unexpectedly overwrote an existing app' >&2
            exit 1
          fi
          test "$before_package" = "$(sha256sum package.json)"
          test "$before_lock" = "$(sha256sum bun.lock)"

      - name: Reject undeclared generation artifacts
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const preset = process.env.PRESET;
          const appRoot = `apps/fixture-${preset}/`;
          const status = execFileSync(
            'git',
            ['status', '--porcelain=v1', '-z', '--untracked-files=all'],
            { encoding: 'utf8' },
          );
          const unexpected = status
            .split('\0')
            .filter(Boolean)
            .map((record) => record.slice(3))
            .filter((path) => path !== 'package.json' && path !== 'bun.lock' && !path.startsWith(appRoot));
          if (unexpected.length > 0) {
            throw new Error(`undeclared generation artifacts: ${unexpected.join(', ')}`);
          }
          NODE
          if find apps -maxdepth 1 -type d \( -name '.create-*' -o -name '.copier-update-*' \) -print -quit | grep -q .; then
            echo 'temporary create-app/conformance directory leaked into the workspace' >&2
            exit 1
          fi
          git diff --check
