name: Mobile App Release

on:
  workflow_dispatch:
    inputs:
      app:
        description: Expo app to qualify.
        required: true
        type: choice
        options:
          - baby-feeding
          - books
          - contractions
          - converter
          - gifts
          - habits
          - money
          - photos
          - tasks
          - wardrobe
      platform:
        description: Store platform(s) to qualify. Android does not require Apple credentials.
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
      source_sha:
        description: Exact 40-character commit SHA to qualify and build.
        required: true
        type: string

concurrency:
  group: mobile-app-release-${{ inputs.app }}-${{ inputs.platform }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify ${{ inputs.app }} (${{ inputs.platform }})
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/release-qualification.yml@578cd414ab533f95eabf37ea8a71cef36eee6a83
    with:
      source_sha: ${{ inputs.source_sha }}
      working_directory: apps/${{ inputs.app }}
      setup_command: npm install --global bun@1.3.12 eas-cli@23.2.0 && cd ../.. && bun install --frozen-lockfile
      qualification_command: bun ../../tooling/release/mobile-release.mjs preflight --app apps/${{ inputs.app }} --platform ${{ inputs.platform }}
      build_command: bun ../../tooling/release/mobile-release.mjs build --app apps/${{ inputs.app }} --platform ${{ inputs.platform }}
      artifact_paths: apps/${{ inputs.app }}/.artifacts/mobile-release
      timeout_minutes: 90
      artifact_retention_days: 30
    secrets:
      build_token: ${{ secrets.EXPO_TOKEN }}

  promote:
    name: Promote qualified app binaries
    needs: qualify
    permissions:
      actions: read
      attestations: read
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/artifact-promotion.yml@578cd414ab533f95eabf37ea8a71cef36eee6a83
    with:
      qualification_run_id: ${{ github.run_id }}
      qualification_receipt_artifact_name: ${{ needs.qualify.outputs.receipt_artifact_name }}
      artifact_retention_days: 30
