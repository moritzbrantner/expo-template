name: Repair Expo SDK dependencies

on:
  push:
    branches:
      - chore/use-expo-template-profile

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/use-expo-template-profile
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bunx expo install --fix
      - run: bunx expo-doctor
      - name: Commit repaired dependency state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "No dependency repair was needed."
            exit 0
          fi
          git commit -m "chore: align Expo SDK patch dependencies"
          git push origin HEAD:chore/use-expo-template-profile
