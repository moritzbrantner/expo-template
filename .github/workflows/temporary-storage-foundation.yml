name: Temporary storage foundation migration

on:
  push:
    branches:
      - codex/mobile-storage-workspace-foundation

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'chore: run storage foundation migration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Apply bounded workspace migration
        run: node scripts/temporary-apply-storage-foundation.mjs

      - name: Refresh dependency graph
        run: bun install

      - name: Validate repository contract
        run: |
          bun run lint
          bunx tsc --noEmit
          bun test
          bun run build
          bunx expo-doctor
          git diff --check

      - name: Commit generated implementation and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock apps/tasks apps/habits packages/storage
          git commit -m 'feat: establish storage workspace foundation'
          git push origin HEAD:${{ github.ref_name }}
