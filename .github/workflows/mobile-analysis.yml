name: Mobile analysis

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - GitHub Pages
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: moritzbrantner/mobile-analysis/.github/workflows/analyze.yml@692f79fd9c1f09670050a2e3f801fb17a28c3be3 # main
    with:
      target_url: https://moritzbrantner.github.io/expo-template/
      config_path: mobile-analysis.config.json
      run_unlighthouse: true
      revision: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

  prioritize:
    needs: analyze
    if: ${{ github.event_name == 'workflow_run' && needs.analyze.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analyzed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download mobile evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mobile-analysis
          path: mobile-analysis-output
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - name: Verify mobile evidence provenance
        env:
          MOBILE_ANALYSIS_EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const expected = process.env.MOBILE_ANALYSIS_EXPECTED_REVISION?.toLowerCase();
          if (!expected || !/^[0-9a-f]{40}$/.test(expected)) {
            throw new Error("expected mobile-analysis revision must be an exact Git SHA");
          }
          const report = JSON.parse(
            readFileSync("mobile-analysis-output/agent-findings.json", "utf8"),
          );
          if (report.producer !== "mobile-analysis" || report.revision !== expected) {
            throw new Error(
              "mobile-analysis artifact revision mismatch: expected " +
                expected +
                ", received " +
                String(report.revision),
            );
          }
          NODE
      - name: Plan mobile remediation
        uses: moritzbrantner/coding-tooling@face2d2688a26427d8efec111fc3c37d37bc5989 # main
        with:
          operation: remediation-plan
          report-path: .artifacts/coding-tooling/mobile-remediation-plan.json
      - name: Upload mobile remediation plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coding-tooling-mobile-remediation
          path: .artifacts/coding-tooling/mobile-remediation-plan.json
          if-no-files-found: error
          retention-days: 14
