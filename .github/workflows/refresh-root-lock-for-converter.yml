name: Refresh root lockfile for converter

on:
  push:
    branches:
      - feat/converter-mobile-release-canary
    paths:
      - package.json
      - .github/workflows/refresh-root-lock-for-converter.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/converter-mobile-release-canary
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - name: Refresh root lockfile
        run: bun install --lockfile-only
      - name: Commit root lockfile
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bun.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: restore root lockfile after converter ownership split'
          git push origin HEAD:feat/converter-mobile-release-canary
