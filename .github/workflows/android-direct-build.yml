name: Android Direct Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: Expo app to build as a signed installable APK.
        required: true
        type: choice
        options:
          - baby-feeding
          - books
          - contractions
          - converter
          - gifts
          - habits
          - money
          - notes
          - photos
          - shopping-list
          - tasks
          - timer
          - wardrobe
      source_sha:
        description: Exact 40-character commit SHA to qualify and build.
        required: true
        type: string

concurrency:
  group: android-direct-${{ inputs.app }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify ${{ inputs.app }} direct APK
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/release-qualification.yml@578cd414ab533f95eabf37ea8a71cef36eee6a83
    with:
      source_sha: ${{ inputs.source_sha }}
      working_directory: apps/${{ inputs.app }}
      setup_command: npm install --global bun@1.3.12 eas-cli@23.2.0 && cd ../.. && bun install --frozen-lockfile
      qualification_command: bun run test && bun run typecheck && bun run build && bun ../../tooling/release/mobile-release.mjs preflight-direct --app apps/${{ inputs.app }}
      build_command: bun ../../tooling/release/mobile-release.mjs direct-android --app apps/${{ inputs.app }}
      artifact_paths: apps/${{ inputs.app }}/.artifacts/android-direct
      timeout_minutes: 90
      artifact_retention_days: 30
    secrets:
      build_token: ${{ secrets.EXPO_TOKEN }}

  promote:
    name: Promote qualified direct APK
    needs: qualify
    permissions:
      actions: read
      attestations: read
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/artifact-promotion.yml@578cd414ab533f95eabf37ea8a71cef36eee6a83
    with:
      qualification_run_id: ${{ github.run_id }}
      qualification_receipt_artifact_name: ${{ needs.qualify.outputs.receipt_artifact_name }}
      artifact_retention_days: 30
