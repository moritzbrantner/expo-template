name: Mobile Release Contract

on:
  pull_request:
    paths:
      - apps/**/app.json
      - apps/**/app.config.ts
      - apps/**/eas.json
      - apps/**/release.config.json
      - tooling/release/**
      - .github/workflows/mobile-release-contract.yml
  push:
    branches:
      - main
    paths:
      - apps/**/app.json
      - apps/**/app.config.ts
      - apps/**/eas.json
      - apps/**/release.config.json
      - tooling/release/**
      - .github/workflows/mobile-release-contract.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Check release tool syntax
        run: node --check tooling/release/mobile-release.mjs
      - name: Check every Expo app release scaffold
        run: bun tooling/release/mobile-release.mjs fleet-check
