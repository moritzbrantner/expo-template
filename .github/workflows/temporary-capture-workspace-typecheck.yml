name: Temporary finalize storage workspace validation

on:
  push:
    branches:
      - codex/mobile-storage-workspace-foundation

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'chore: finalize storage workspace validation' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Normalize workspace lock
        run: bun install
      - name: Validate clean workspace
        run: |
          bun install --frozen-lockfile
          bun run lint
          bunx tsc --noEmit
          bun test
          bun run build
          bunx expo-doctor
          git diff --check
      - name: Preserve normalized lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- bun.lock; then
            echo 'bun.lock already normalized'
            exit 0
          fi
          git add bun.lock
          git commit -m 'fix: normalize storage workspace lock'
          git push origin HEAD:${{ github.ref_name }}
