name: Refactor shared local storage

on:
  push:
    branches:
      - feat/shared-local-storage

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-local-storage
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Migrate Tasks and Habits to the shared transport
        shell: python
        run: |
          import json
          from pathlib import Path

          for path in [Path('apps/tasks/package.json'), Path('apps/habits/package.json')]:
              package = json.loads(path.read_text())
              package.setdefault('dependencies', {})['@expo-template/local-storage'] = 'workspace:*'
              package['dependencies'] = dict(sorted(package['dependencies'].items()))
              path.write_text(json.dumps(package, indent=2) + '\n')

          tasks_path = Path('apps/tasks/app/index.tsx')
          tasks = tasks_path.read_text()
          if "import { createLocalJsonStore } from '@expo-template/local-storage';" not in tasks:
              tasks = tasks.replace(
                  "import AsyncStorage from '@react-native-async-storage/async-storage';\n",
                  "import AsyncStorage from '@react-native-async-storage/async-storage';\nimport { createLocalJsonStore } from '@expo-template/local-storage';\n",
                  1,
              )
          if 'const taskStorage = createLocalJsonStore<Task[]>' not in tasks:
              tasks = tasks.replace(
                  "const STORAGE_KEY = '@expo-template/tasks/list-v1';\n",
                  "const STORAGE_KEY = '@expo-template/tasks/list-v1';\nconst taskStorage = createLocalJsonStore<Task[]>({\n  key: STORAGE_KEY,\n  deserialize: deserializeTasks,\n  fallback: () => [],\n});\n",
                  1,
              )
          old_tasks_load = """    void AsyncStorage.getItem(STORAGE_KEY)\n      .then((stored) => {\n        if (active) {\n          setTasks(deserializeTasks(stored));\n        }\n      })\n      .catch(() => {\n        // A damaged or unavailable local cache should not prevent the task list from opening.\n      })\n      .finally(() => {\n        if (active) {\n          setHydrated(true);\n        }\n      });"""
          new_tasks_load = """    void taskStorage.load()\n      .then((storedTasks) => {\n        if (active) {\n          setTasks(storedTasks);\n        }\n      })\n      .finally(() => {\n        if (active) {\n          setHydrated(true);\n        }\n      });"""
          tasks = tasks.replace(old_tasks_load, new_tasks_load)
          tasks = tasks.replace(
              "void AsyncStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));",
              "void taskStorage.save(tasks);",
          )
          tasks_path.write_text(tasks)

          habits_path = Path('apps/habits/app/index.tsx')
          habits = habits_path.read_text()
          habits = habits.replace(
              "import AsyncStorage from '@react-native-async-storage/async-storage';\n",
              "import { createLocalJsonStore } from '@expo-template/local-storage';\n",
              1,
          )
          if 'const habitStorage = createLocalJsonStore<Habit[]>' not in habits:
              habits = habits.replace(
                  "const STORAGE_KEY = '@expo-template/habits/list-v1';\n",
                  "const STORAGE_KEY = '@expo-template/habits/list-v1';\nconst habitStorage = createLocalJsonStore<Habit[]>({\n  key: STORAGE_KEY,\n  deserialize: deserializeHabits,\n  fallback: () => [],\n});\n",
                  1,
              )
          old_habits_load = """    void AsyncStorage.getItem(STORAGE_KEY)\n      .then((stored) => {\n        if (active) setHabits(deserializeHabits(stored));\n      })\n      .catch(() => {})\n      .finally(() => {\n        if (active) setHydrated(true);\n      });"""
          new_habits_load = """    void habitStorage.load()\n      .then((storedHabits) => {\n        if (active) setHabits(storedHabits);\n      })\n      .finally(() => {\n        if (active) setHydrated(true);\n      });"""
          habits = habits.replace(old_habits_load, new_habits_load)
          habits = habits.replace(
              "void AsyncStorage.setItem(STORAGE_KEY, JSON.stringify(habits));",
              "void habitStorage.save(habits);",
          )
          habits_path.write_text(habits)
      - name: Regenerate authoritative lockfile
        run: bun install --lockfile-only
      - name: Verify package contract
        run: bun test ./tests/local-storage-package.test.ts
      - name: Commit migration when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/tasks apps/habits bun.lock
          git commit -m "Consume shared local-storage package"
          git push origin HEAD:feat/shared-local-storage
