name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@b11bce847d35b90e5d6e8f69bacd26c709416781
    with:
      test_command: bun test
      lint_command: bun run lint
      typecheck_command: bunx tsc --noEmit
      build_command: bun run build
      post_validate_command: bunx expo-doctor
