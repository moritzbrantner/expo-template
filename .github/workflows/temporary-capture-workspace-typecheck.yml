name: Temporary isolate storage workspace validation

on:
  push:
    branches:
      - codex/mobile-storage-workspace-foundation

permissions:
  contents: write

jobs:
  isolate:
    if: "${{ github.event.head_commit.message == 'chore: isolate storage workspace validation' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Refresh root workspace lock
        run: bun install
      - name: Capture command outcomes
        run: |
          set +e
          : > scripts/temporary-workspace-validation.log
          overall=0
          for command in \
            'bun install --frozen-lockfile' \
            'bun run lint' \
            'bunx tsc --noEmit' \
            'bun test' \
            'bun run build' \
            'bunx expo-doctor' \
            'git diff --check'; do
            printf '\n$ %s\n' "$command" | tee -a scripts/temporary-workspace-validation.log
            bash -lc "$command" 2>&1 | tee -a scripts/temporary-workspace-validation.log
            status=${PIPESTATUS[0]}
            printf 'exit_status=%s\n' "$status" | tee -a scripts/temporary-workspace-validation.log
            if [ "$status" -ne 0 ]; then overall=1; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock scripts/temporary-workspace-validation.log
          git commit -m 'chore: preserve workspace validation diagnostics'
          git push origin HEAD:${{ github.ref_name }}
          exit "$overall"
