name: Template Contract

on:
  pull_request:
    paths:
      - copier.yml
      - conventions.json
      - .coding-tooling.json
      - .editorconfig
      - template/**
      - .github/workflows/template-contract.yml
  push:
    branches:
      - main
    paths:
      - copier.yml
      - conventions.json
      - .coding-tooling.json
      - .editorconfig
      - template/**
      - .github/workflows/template-contract.yml

jobs:
  render:
    name: render / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimal
            navigation: stack
          - profile: local-first
            navigation: tabs
          - profile: account-backed
            navigation: stack
          - profile: scheduled
            navigation: tabs

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install Copier
        run: python -m pip install 'copier>=9.10,<10'

      - name: Render profile
        run: |
          copier copy --trust --defaults \
            --data app_name="Fixture ${{ matrix.profile }}" \
            --data app_slug="fixture-${{ matrix.profile }}" \
            --data profile="${{ matrix.profile }}" \
            --data navigation="${{ matrix.navigation }}" \
            . generated

      - name: Verify generated contract
        env:
          EXPECTED_PROFILE: ${{ matrix.profile }}
          EXPECTED_NAVIGATION: ${{ matrix.navigation }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('generated/package.json', 'utf8'));
          const conventions = JSON.parse(fs.readFileSync('generated/conventions.json', 'utf8'));
          const tooling = JSON.parse(fs.readFileSync('generated/.coding-tooling.json', 'utf8'));
          const eas = JSON.parse(fs.readFileSync('generated/eas.json', 'utf8'));
          const release = JSON.parse(fs.readFileSync('generated/release.config.json', 'utf8'));
          const features = fs.readFileSync('generated/app.features.ts', 'utf8');
          const layout = fs.readFileSync('generated/app/_layout.tsx', 'utf8');
          const mobileRelease = fs.readFileSync('generated/.github/workflows/mobile-release.yml', 'utf8');
          const releaseBuild = fs.readFileSync('generated/scripts/build-store-release.ts', 'utf8');
          const releasePreflight = fs.readFileSync('generated/scripts/check-store-release.ts', 'utf8');
          const expected = process.env.EXPECTED_PROFILE;
          const expectedNavigation = process.env.EXPECTED_NAVIGATION;
          const hasAuth = fs.existsSync('generated/core/auth') && fs.existsSync('generated/app/sign-in.tsx');
          const hasDatabase = fs.existsSync('generated/core/database/app-database.ts');
          const hasNotifications = fs.existsSync('generated/core/notifications/local-reminders.ts') && fs.existsSync('generated/app/reminder.tsx');
          const initializesNotifications = layout.includes("import '../core/notifications/local-reminders';");

          if (packageJson.name !== `fixture-${expected}`) throw new Error('wrong generated slug');
          if (packageJson.packageManager !== 'bun@1.3.12') throw new Error('generated Bun version must be exact');
          if (conventions.registry !== 'coding-agent-conventions') throw new Error('missing generated convention registry');
          if (tooling.profile !== 'repository-foundation-v1') throw new Error('missing generated tooling profile');
          if (!tooling.tiers?.fast?.includes('typecheck')) throw new Error('generated fast tier must typecheck');
          if (!fs.existsSync('generated/.editorconfig')) throw new Error('missing generated editor defaults');
          if (!features.includes(`profile: '${expected}'`)) throw new Error('wrong feature profile');
          if (!features.includes(`navigation: '${expectedNavigation}'`)) throw new Error('wrong navigation shape');
          if (!fs.existsSync('generated/.copier-answers.yml')) throw new Error('missing Copier answers');
          if (hasAuth !== (expected === 'account-backed')) throw new Error('auth boundary mismatch');
          if (hasDatabase !== ['local-first', 'scheduled'].includes(expected)) throw new Error('database boundary mismatch');
          if (hasNotifications !== (expected === 'scheduled')) throw new Error('notification boundary mismatch');
          if (initializesNotifications !== (expected === 'scheduled')) throw new Error('notification initialization boundary mismatch');
          if (!fs.existsSync('generated/.maestro/stopwatch.yaml')) throw new Error('missing native stopwatch flow');

          if (eas.cli?.version !== '23.2.0') throw new Error('generated EAS CLI version must be exact');
          if (eas.cli?.requireCommit !== true) throw new Error('generated EAS release must require a commit');
          if (eas.build?.production?.autoIncrement !== true) throw new Error('production build must autoIncrement native versions');
          if (eas.submit?.internal?.android?.track !== 'internal') throw new Error('internal delivery must target Play internal');
          if (eas.submit?.internal?.android?.releaseStatus !== 'completed') throw new Error('Play internal delivery must complete its internal release');
          if (eas.submit?.production?.android?.track !== 'production') throw new Error('production delivery must target Play production');
          if (eas.submit?.production?.android?.releaseStatus !== 'draft') throw new Error('generated Play production delivery must remain draft');
          if (release.schemaVersion !== 1 || release.appSlug !== `fixture-${expected}`) throw new Error('missing app-owned release config');
          if (release.release?.buildProfile !== 'production') throw new Error('release config must build through production profile');
          if (!packageJson.scripts?.['release:preflight'] || !packageJson.scripts?.['release:qualify'] || !packageJson.scripts?.['release:build']) throw new Error('missing release commands');
          if (!releaseBuild.includes("'eas',\n      'build'") || !releaseBuild.includes('mobile-release.json')) throw new Error('release build must create exact EAS binary evidence');
          if (!releaseBuild.includes("'--non-interactive'")) throw new Error('release build must be non-interactive');
          if (!releasePreflight.includes('submit.internal.ios.ascAppId')) throw new Error('release preflight must require App Store Connect identity');

          const refs = [...mobileRelease.matchAll(/moritzbrantner\/reusable-workflows\/\.github\/workflows\/[A-Za-z0-9._-]+@([0-9a-f]{40})/g)].map((match) => match[1]);
          if (refs.length !== 3 || new Set(refs).size !== 1) throw new Error('mobile release workflow must pin one exact reusable-workflows revision');
          if (!mobileRelease.includes('artifact_paths: .artifacts/mobile-release')) throw new Error('mobile release workflow must preserve the mobile release artifact');
          if (!mobileRelease.includes('build_token:') || !mobileRelease.includes('secrets.EXPO_TOKEN')) throw new Error('mobile qualification must pass Expo credentials only through build_token');
          if (!mobileRelease.includes('expo_token:')) throw new Error('mobile delivery must pass Expo credentials through the terminal delivery seam');
          NODE

      - name: Install generated dependencies
        working-directory: generated
        run: bun install

      - name: Verify frozen generated install
        working-directory: generated
        run: bun install --frozen-lockfile

      - name: Lint generated app
        working-directory: generated
        run: bun run lint

      - name: Typecheck generated app
        working-directory: generated
        run: bun run typecheck

      - name: Test generated core
        working-directory: generated
        run: bun test

      - name: Check Expo dependency health
        working-directory: generated
        run: bunx expo-doctor
